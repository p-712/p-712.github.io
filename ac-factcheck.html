<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에어컨과 우리 교실의 과학 : AI 팩트체크 기록장</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Freesentation & Pretendard Webfont CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/webfontworld/freesentation/Freesentation.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2canvas CDN for crisp image generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      font-family: 'Freesentation', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const [formData, setFormData] = useState({
        schoolClass: '',
        studentName: '',
        lessonLearned: ''
      });

      const [images, setImages] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const cardRef = useRef(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleImageFiles = (files) => {
        if (!files || files.length === 0) return;
        const fileArray = Array.from(files);
        
        fileArray.forEach(file => {
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setImages(prev => [...prev, reader.result]);
            };
            reader.readAsDataURL(file);
          }
        });
      };

      const handleImageUpload = (e) => {
        handleImageFiles(e.target.files);
        e.target.value = '';
      };

      const handlePaste = (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        const pastedFiles = [];
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            if (file) pastedFiles.push(file);
          }
        }
        if (pastedFiles.length > 0) {
          handleImageFiles(pastedFiles);
          showToast('클립보드 이미지가 추가되었습니다!', 'success');
        }
      };

      const removeImage = (index) => {
        setImages(prev => prev.filter((_, i) => i !== index));
      };

      const handleDownloadImage = async () => {
        if (!cardRef.current) return;
        setIsGenerating(true);
        try {
          const canvas = await html2canvas(cardRef.current, {
            scale: 3,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false
          });
          const image = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = image;
          link.download = `AI_팩트체크_${formData.studentName || '학생'}.png`;
          link.click();
          showToast('이미지 카드가 PNG 파일로 저장되었습니다.', 'success');
        } catch (err) {
          showToast('이미지 저장 중 오류가 발생했습니다.', 'error');
          console.error(err);
        } finally {
          setIsGenerating(false);
        }
      };

      const handleCopyClipboard = async () => {
        if (!cardRef.current) return;
        setIsGenerating(true);
        try {
          const canvas = await html2canvas(cardRef.current, {
            scale: 3,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false
          });
          canvas.toBlob(async (blob) => {
            if (!blob) {
              showToast('이미지 생성에 실패했습니다.', 'error');
              setIsGenerating(false);
              return;
            }
            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              showToast('클립보드에 이미지가 복사되었습니다!', 'success');
            } catch (err) {
              console.error(err);
              showToast('클립보드 복사 기능을 지원하지 않거나 권한이 없습니다. 이미지 저장 버튼을 사용해 주세요.', 'error');
            } finally {
              setIsGenerating(false);
            }
          }, 'image/png');
        } catch (err) {
          showToast('클립보드 복사 중 오류가 발생했습니다.', 'error');
          console.error(err);
          setIsGenerating(false);
        }
      };

      return (
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8" onPaste={handlePaste}>
          {toast && (
            <div class={`fixed top-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-xl border text-sm font-bold flex items-center gap-2 transition-all transform translate-y-0 ${
              toast.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
              toast.type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200' :
              'bg-indigo-50 text-indigo-800 border-indigo-200'
            }`}>
              <i class={`fa-solid ${
                toast.type === 'success' ? 'fa-circle-check text-emerald-500' :
                toast.type === 'error' ? 'fa-circle-exclamation text-rose-500' :
                'fa-circle-info text-indigo-500'
              }`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* Header */}
          <header class="mb-8 text-center border-b border-slate-200 pb-6">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold rounded-full mb-3">
              <i class="fa-solid fa-snowflake text-indigo-500"></i>
              <span>엉터리 AI를 이겨라! 과학으로 푸는 교실 에어컨 쟁점 (1차시)</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
              에어컨과 우리 교실의 과학 : AI 오류 탐지 & 팩트체크
            </h1>
            <p class="text-slate-600 text-sm sm:text-base mt-2 max-w-3xl mx-auto leading-relaxed">
              학습한 열의 이동(전도·대류·복사), 열평형, 비열 원리를 바탕으로 챗봇 답변 속 과학적 오류(할루시네이션)를 찾아 반박한 대화 캡처를 첨부하고, 비판적 탐구 성찰을 작성해 리포트 카드를 완성하세요.
            </p>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            {/* LEFT: Input Form Panel */}
            <div class="lg:col-span-6 bg-white p-6 sm:p-7 rounded-3xl shadow-sm border border-slate-200 space-y-6">
              <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                  <i class="fa-solid fa-file-pen text-indigo-600"></i>
                  <span>내용 입력하기</span>
                </h2>
                <span class="text-xs text-slate-400">Ctrl + V 키로 이미지 붙여넣기 가능</span>
              </div>

              {/* 학번 & 이름 */}
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">학년 / 반 / 번호</label>
                  <input
                    type="text"
                    name="schoolClass"
                    placeholder="예: 1학년 2반 15번"
                    value={formData.schoolClass}
                    onChange={handleChange}
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none"
                  />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">이름</label>
                  <input
                    type="text"
                    name="studentName"
                    placeholder="이름 입력"
                    value={formData.studentName}
                    onChange={handleChange}
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none"
                  />
                </div>
              </div>

              {/* Multiple Image Upload Box */}
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">
                  📸 탐구 과정 캡처 이미지 (질문 ➔ AI 오류 답변 ➔ 나의 과학적 반박 ➔ 교정 완료)
                </label>
                <div class="border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center bg-slate-50/70 hover:bg-slate-50 transition">
                  <p class="text-xs font-semibold text-slate-600 mb-2">
                    <i class="fa-solid fa-images mr-1.5 text-indigo-500"></i> 이미지 파일 선택 (여러 장 선택 가능) 또는 Ctrl+V
                  </p>
                  <input
                    type="file"
                    accept="image/*"
                    multiple
                    onChange={handleImageUpload}
                    class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
                  />
                  {images.length > 0 && (
                    <div class="mt-4 space-y-2">
                      <p class="text-xs text-slate-500 font-bold text-left">첨부된 이미지 ({images.length}장)</p>
                      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-60 overflow-y-auto p-1 custom-scrollbar">
                        {images.map((imgSrc, idx) => (
                          <div key={idx} class="relative group rounded-xl overflow-hidden border border-slate-200 bg-white shadow-xs">
                            <img src={imgSrc} alt={`캡처 ${idx + 1}`} class="w-full h-24 object-cover" />
                            <span class="absolute bottom-1 left-1 bg-slate-900/70 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">
                              #{idx + 1}
                            </span>
                            <button
                              onClick={() => removeImage(idx)}
                              class="absolute top-1 right-1 bg-rose-500 hover:bg-rose-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center shadow transition"
                              title="이미지 삭제"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* 활동을 통해 알게 된 AI 활용 시 주의사항 및 나의 다짐 */}
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">
                  💡 활동을 통해 알게 된 AI 활용 시 주의사항 및 나의 다짐
                </label>
                <textarea
                  name="lessonLearned"
                  rows="4"
                  placeholder="AI가 제시한 열역학 오류(대류·복사·전도·열평형·비열 등)를 직접 바로잡으며 느낀 점과, 앞으로 AI 정보를 비판적으로 검증하고 활용할 때 가질 나의 과학적 태도 및 다짐을 적어주세요."
                  value={formData.lessonLearned}
                  onChange={handleChange}
                  class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none resize-none"
                ></textarea>
              </div>
            </div>

            {/* RIGHT: Live Preview Card Panel */}
            <div class="lg:col-span-6 lg:sticky lg:top-8 space-y-4">
              <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                  <i class="fa-solid fa-eye text-emerald-600"></i>
                  <span>저장용 리포트 카드 미리보기</span>
                </h2>
                <span class="text-xs font-medium text-slate-400 bg-slate-200/60 px-2.5 py-1 rounded-full">
                  실시간 반영 중
                </span>
              </div>

              {/* Printable Verification Card */}
              <div
                ref={cardRef}
                id="verification-card"
                class="bg-white p-7 sm:p-8 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 space-y-6"
              >
                {/* Card Top Header */}
                <div class="flex justify-between items-start border-b border-slate-100 pb-4">
                  <div>
                    <span class="inline-block px-2.5 py-1 bg-rose-100 text-rose-700 text-[11px] font-black rounded-md tracking-wider uppercase mb-1">
                      에어컨 과학 원리 팩트체크
                    </span>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                      AI 오류 검증 & 팩트체크 리포트
                    </h3>
                  </div>
                  <div class="text-right shrink-0">
                    <p class="text-xs text-slate-500 font-semibold">{formData.schoolClass || '학년/반/번 미입력'}</p>
                    <p class="text-sm font-bold text-slate-800">{formData.studentName || '학생 이름'}</p>
                  </div>
                </div>

                {/* Vertical Stack for Images */}
                <div class="space-y-3">
                  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <p class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                      <i class="fa-solid fa-photo-film text-indigo-500"></i>
                      <span>탐구 과정 (질문 ➔ AI 오류 ➔ 학생 과학적 반박)</span>
                    </p>
                    <span class="text-[11px] font-semibold text-slate-400">총 {images.length}장</span>
                  </div>

                  {images.length > 0 ? (
                    <div class="space-y-3">
                      {images.map((imgSrc, idx) => (
                        <div key={idx} class="rounded-2xl overflow-hidden border border-slate-200/80 shadow-xs bg-slate-50/50 p-1">
                          <img
                            src={imgSrc}
                            alt={`탐구 과정 캡처 ${idx + 1}`}
                            class="w-full h-auto max-w-full rounded-xl object-contain mx-auto"
                          />
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div class="py-8 px-4 border-2 border-dashed border-slate-200 rounded-2xl text-center bg-slate-50/50">
                      <i class="fa-solid fa-image text-slate-300 text-3xl mb-2 block"></i>
                      <p class="text-xs text-slate-400 font-medium">
                        질문, AI 답변, 과학적 반박 과정이 포함된 대화 캡처 이미지를 왼쪽 폼에 첨부해주세요.
                      </p>
                    </div>
                  )}
                </div>

                {/* 활동을 통해 알게 된 AI 활용 시 주의사항 및 나의 다짐 Block */}
                <div class="bg-emerald-50/60 border border-emerald-100 p-5 rounded-2xl space-y-1.5">
                  <p class="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                    <span>활동을 통해 알게 된 AI 활용 시 주의사항 및 나의 다짐</span>
                  </p>
                  <p class="text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-wrap font-medium">
                    {formData.lessonLearned || 'AI 검증 활동을 통해 알게 된 내용 및 과학적·비판적 활용 다짐을 적어주세요.'}
                  </p>
                </div>

                {/* Card Footer Badge */}
                <div class="pt-3 border-t border-dashed border-slate-200 text-center">
                  <p class="text-[11px] font-medium text-slate-400">
                    에어컨과 우리 교실의 과학 · AI 오류 탐지 및 팩트체크 활동 리포트
                  </p>
                </div>
              </div>

              {/* Action Buttons */}
              <div class="pt-2 space-y-2.5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button
                    onClick={handleDownloadImage}
                    disabled={isGenerating}
                    class="py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                  >
                    <i class="fa-solid fa-download"></i>
                    <span>{isGenerating ? '생성 중...' : '이미지 카드로 저장하기 (.png)'}</span>
                  </button>

                  <button
                    onClick={handleCopyClipboard}
                    disabled={isGenerating}
                    class="py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                  >
                    <i class="fa-solid fa-copy"></i>
                    <span>클립보드에 복사하기</span>
                  </button>
                </div>

                <p class="text-xs text-center text-slate-500 flex items-center justify-center gap-1 pt-1">
                  <i class="fa-solid fa-circle-info text-indigo-400"></i>
                  <span>저장 또는 복사한 이미지를 패들렛(Padlet) 등에 업로드해 친구들과 공유해보세요!</span>
                </p>
              </div>

            </div>

          </div>

          {/* Bottom Footer Credit */}
          <footer class="mt-12 text-center text-xs text-slate-400 font-medium">
            교사 김가은 제작
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
